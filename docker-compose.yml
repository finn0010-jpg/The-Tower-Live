services:
  nodejs:
    build: ./app
    container_name: nodejs-app
    restart: unless-stopped
    networks:
      - tower-net

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - "/home/echlipse04/nginx-server/The-Tower-Live/frontend:/usr/share/nginx/html:ro"
    depends_on:
      - nodejs
    networks:
      - tower-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token eyJhIjoiN2M1Y2NkODYzNjc1YzAyMTZkZmU2NWUyZjI0OTY2ZTIiLCJ0IjoiNjFhY2Y0YjQtZjY2OC00NTcxLWIwYjMtZTJjMzc3OTgzY2FjIiwicyI6Ik9HWTBNMkV4TWpndE5qQmxOeTAwTjJNNUxXSmhPRFV0WTJJMFpUZGpNRGd6TkdGbCJ9

    depends_on:
      - nginx
    networks:
      - tower-net

networks:
  tower-net:
    driver: bridge
